services:
  # Backend Web Service (FastAPI)
  - type: web
    name: hirestream-backend
    env: python
    rootDir: hirestream/backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_CREATE_DB
        value: "true"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: uploads/resumes
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hirestream-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:3000"

databases:
  # Managed PostgreSQL Database
  - name: hirestream-db
    databaseName: hiring_platform
    user: postgres
    plan: free
